<!doctype html><html><head><meta charset="utf-8"><title>Internal Docs RAG</title><link rel="stylesheet" href="/style.css"></head><body><main><h1>Internal Docs RAG</h1><p class="sub">Hybrid retrieval with citations and confidence.</p><section class="card"><h2>Ingest documents</h2><input id="files" type="file" multiple accept=".pdf,.txt,.md,.html,.docx"><select id="strategy"><option>recursive</option><option>fixed</option><option>semantic</option></select><button onclick="ingest()">Index</button><pre id="ingestResult"></pre></section><section class="card"><h2>Ask a question</h2><textarea id="question" placeholder="Ask about your internal documents..."></textarea><button onclick="ask()">Ask</button><div id="answer"></div></section><section class="card"><h2>Indexed documents</h2><button onclick="loadDocs()">Refresh</button><pre id="docs"></pre></section></main><script src="/app.js"></script></body></html>
